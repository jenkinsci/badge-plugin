name: 'Generate Coverage Report'

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: Coverage on Ubuntu
    steps:
      - name: Set up JDK and Maven
        uses: s4u/setup-maven-action@5d4481650d2563723ad6c5e8f009ac8fd746e3e8 # v1.22.0
        with:
          java-distribution: 'temurin'
          java-version: '21'
      - name: Generate coverage with JaCoCo
        run: mvn clean jacoco:prepare-agent test jacoco:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          file: ./target/site/jacoco/jacoco.xml
